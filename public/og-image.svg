<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A3D"/>
      <stop offset="100%" style="stop-color:#e06a20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Card -->
  <rect x="120" y="80" width="960" height="470" rx="32" fill="white" opacity="0.12"/>
  <!-- Logo circle -->
  <circle cx="600" cy="230" r="80" fill="white" opacity="0.2"/>
  <text x="600" y="260" font-family="sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">₹</text>
  <!-- Title -->
  <text x="600" y="370" font-family="sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">Money Meva</text>
  <!-- Tagline -->
  <text x="600" y="430" font-family="sans-serif" font-size="28" fill="white" fill-opacity="0.9" text-anchor="middle">पैसे कुठे जातात? शोधूया.</text>
  <text x="600" y="470" font-family="sans-serif" font-size="22" fill="white" fill-opacity="0.7" text-anchor="middle">Where does the money go? Let's find out.</text>
</svg>
