name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'VERSION'
      - 'android/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bake the same default cloud-sync project as the web deploys so the
      # Android app talks to the same database out of the box (otherwise the
      # APK ships with a blank project and syncs against whatever URL the
      # user pastes — a classic "connected but empty" mismatch).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/bump-version.cjs ${{ github.event.inputs.version_type }}

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Sync Android version
        run: node scripts/update-android-version.cjs

      - name: Build debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MoneyMeva-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
