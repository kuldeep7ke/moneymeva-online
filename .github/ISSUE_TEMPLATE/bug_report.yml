name: Bug Report
description: Report a bug to help improve Money Meva
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen recording
      description: If applicable, add screenshots or a screen recording.

  - type: input
    id: device
    attributes:
      label: Device
      description: e.g. Desktop, iPhone 14, Samsung Galaxy
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g. Chrome 120, Safari 17
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Check the About page for the version number.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs
      description: Paste any relevant browser console errors.
      render: shell
