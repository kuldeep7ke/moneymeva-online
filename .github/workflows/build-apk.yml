name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'VERSION'
      - 'android/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/bump-version.cjs ${{ github.event.inputs.version_type }}

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Sync Android version
        run: node scripts/update-android-version.cjs

      - name: Build debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMeva-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
