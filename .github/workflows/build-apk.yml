name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          for pkg in @capacitor/cli @capacitor/core @capacitor/android; do
            npm ls "$pkg" 2>&1 || npm install "$pkg@8.4.1"
          done
          echo "--- Verifying ---"
          ls -la ./node_modules/@capacitor/

      - name: Bump version
        run: node scripts/bump-version.cjs patch

      - name: Sync version to Android
        run: node scripts/update-android-version.cjs

      - name: Build Next.js
        run: npx next build 2>&1 | tee build-output.txt

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Build-Logs
          path: build-output.txt

      - name: Sync Capacitor
        run: npx --yes @capacitor/cli sync

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$HOME/android}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_ROOT" >> android/local.properties

          # Find or install cmdline-tools
          SDKMAN=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMAN" ]; then
            mkdir -p "$SDK_ROOT"
            cd /tmp
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMAN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMAN" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1
          yes | "$SDKMAN" --licenses 2>&1 || true

      - name: Generate debug keystore (if missing)
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      - name: Upload debug keystore (first run only)
        uses: actions/upload-artifact@v6
        with:
          name: debug-keystore
          path: android/app/debug.keystore
          if-no-files-found: ignore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MoneyMeva-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
